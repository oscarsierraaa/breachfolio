<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(240, 10%, 4%)"/>
      <stop offset="100%" stop-color="hsl(240, 6%, 9%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="hsl(142, 76%, 45%)" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="hsl(142, 76%, 45%)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="hsl(0, 0%, 98%)" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand mark -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="12" fill="hsl(142, 76%, 45%)" fill-opacity="0.12" stroke="hsl(142, 76%, 45%)" stroke-opacity="0.35" stroke-width="2"/>
    <g transform="translate(16, 16)">
      <path d="M16 2 L26 6 V14 Q26 22 16 30 Q6 22 6 14 V6 Z"
            fill="hsl(142, 76%, 45%)" fill-opacity="0.18"
            stroke="hsl(142, 76%, 45%)" stroke-width="2" stroke-linejoin="round"/>
      <line x1="10.5" y1="12" x2="19" y2="12" stroke="hsl(142, 76%, 45%)" stroke-width="2" stroke-linecap="round"/>
      <line x1="10.5" y1="15.5" x2="21" y2="15.5" stroke="hsl(142, 76%, 45%)" stroke-width="2" stroke-linecap="round"/>
      <line x1="10.5" y1="19" x2="16.5" y2="19" stroke="hsl(172, 78%, 48%)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="24" cy="7" r="2" fill="hsl(172, 78%, 48%)"/>
    </g>
    <text x="84" y="44" font-family="Sora, ui-sans-serif, sans-serif" font-weight="600" font-size="34" fill="#fafafa" letter-spacing="-0.8">
      <tspan fill="hsl(142, 76%, 45%)">Breach</tspan><tspan fill="hsl(172, 78%, 48%)">folio</tspan>
    </text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 270)">
    <text font-family="Sora, ui-sans-serif, sans-serif" font-weight="600" font-size="78" fill="#fafafa" letter-spacing="-2">
      <tspan x="0" y="0">Learn AI and</tspan>
      <tspan x="0" y="92">cybersecurity,</tspan>
      <tspan x="0" y="184" fill="hsl(142, 76%, 45%)">without the marketing.</tspan>
    </text>
  </g>

  <!-- Footer line -->
  <g transform="translate(80, 555)">
    <text font-family="JetBrains Mono, ui-monospace, monospace" font-weight="400" font-size="20" fill="hsl(240, 5%, 65%)" letter-spacing="3">
      INDEPENDENT · PRACTICAL · FREE TO READ
    </text>
  </g>
</svg>
