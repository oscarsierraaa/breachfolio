<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, monospace">
<defs>
  <pattern id="clgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="hsl(0 0% 100% / 0.05)" stroke-width="1"/></pattern>
  <radialGradient id="clglow" cx="0.62" cy="0.42" r="0.65"><stop offset="0%" stop-color="hsl(168 78% 46%)" stop-opacity="0.30"/><stop offset="55%" stop-color="hsl(168 78% 46%)" stop-opacity="0.06"/><stop offset="100%" stop-color="hsl(168 78% 46%)" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="400" fill="hsl(240 10% 4%)"/>
<rect width="800" height="400" fill="url(#clgrid)"/>
<ellipse cx="500" cy="180" rx="380" ry="260" fill="url(#clglow)"/>

<path d="M135 340 L615 80" fill="none" stroke="hsl(190 85% 52%)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.55"/>
<path d="M615 80 l-24 2 M615 80 l6 24" stroke="hsl(190 85% 52%)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

<!-- Tier 1: entry -->
<rect x="70" y="280" width="130" height="60" rx="6" fill="hsl(168 78% 46%)" fill-opacity="0.12" stroke="hsl(168 78% 46%)" stroke-width="2" opacity="0.6"/>
<circle cx="135" cy="280" r="9" fill="hsl(240 10% 4%)" stroke="hsl(168 78% 46%)" stroke-width="2.5"/><circle cx="135" cy="280" r="3.2" fill="hsl(168 78% 46%)"/>
<text x="135" y="258" text-anchor="middle" font-size="11" fill="hsl(240 5% 65%)" letter-spacing="2" opacity="0.75">ENTRY</text>
<text x="135" y="316" text-anchor="middle" font-size="13" fill="hsl(240 98% 97%)" letter-spacing="0.5">Security+</text>

<!-- Tier 2: associate -->
<rect x="230" y="210" width="130" height="130" rx="6" fill="hsl(168 78% 46%)" fill-opacity="0.16" stroke="hsl(168 78% 46%)" stroke-width="2" opacity="0.7"/>
<circle cx="295" cy="210" r="9" fill="hsl(240 10% 4%)" stroke="hsl(168 78% 46%)" stroke-width="2.5"/><circle cx="295" cy="210" r="3.2" fill="hsl(168 78% 46%)"/>
<text x="295" y="188" text-anchor="middle" font-size="11" fill="hsl(240 5% 65%)" letter-spacing="2" opacity="0.75">ASSOCIATE</text>
<text x="295" y="246" text-anchor="middle" font-size="13" fill="hsl(240 98% 97%)" letter-spacing="0.5">CySA+</text>
<text x="295" y="266" text-anchor="middle" font-size="13" fill="hsl(240 98% 97%)" letter-spacing="0.5">CEH</text>

<!-- Tier 3: advanced -->
<rect x="390" y="145" width="130" height="195" rx="6" fill="hsl(168 78% 46%)" fill-opacity="0.20" stroke="hsl(168 78% 46%)" stroke-width="2" opacity="0.85"/>
<circle cx="455" cy="145" r="9" fill="hsl(240 10% 4%)" stroke="hsl(168 78% 46%)" stroke-width="2.5"/><circle cx="455" cy="145" r="3.2" fill="hsl(168 78% 46%)"/>
<text x="455" y="123" text-anchor="middle" font-size="11" fill="hsl(240 5% 65%)" letter-spacing="2" opacity="0.75">ADVANCED</text>
<text x="455" y="181" text-anchor="middle" font-size="13" fill="hsl(240 98% 97%)" letter-spacing="0.5">OSCP</text>

<!-- Tier 4: expert / leadership -->
<rect x="550" y="80" width="130" height="260" rx="6" fill="hsl(168 78% 46%)" fill-opacity="0.26" stroke="hsl(168 78% 46%)" stroke-width="2.5" opacity="1"/>
<circle cx="615" cy="80" r="10" fill="hsl(240 10% 4%)" stroke="hsl(168 78% 46%)" stroke-width="3"/><circle cx="615" cy="80" r="3.6" fill="hsl(168 78% 46%)"/>
<text x="615" y="58" text-anchor="middle" font-size="11" fill="hsl(240 5% 65%)" letter-spacing="2" opacity="0.85">EXPERT / LEADERSHIP</text>
<text x="615" y="116" text-anchor="middle" font-size="13" fill="hsl(240 98% 97%)" letter-spacing="0.5">CISSP</text>

<line x1="40" y1="340" x2="720" y2="340" stroke="hsl(240 5% 65%)" stroke-width="1" opacity="0.25"/>

<g font-size="12" letter-spacing="3" font-weight="500">
  <text x="24" y="34" fill="hsl(168 78% 46%)" opacity="0.95">RESOURCES / CERTIFICATION LADDER</text>
  <text x="24" y="378" fill="hsl(240 5% 65%)" opacity="0.6">ENTRY -&gt; ASSOCIATE -&gt; ADVANCED -&gt; EXPERT</text>
  <text x="776" y="378" text-anchor="end" fill="hsl(240 5% 65%)" opacity="0.4">BREACHFOLIO</text>
</g>
<circle cx="776" cy="30" r="4" fill="hsl(168 78% 46%)"/>
<circle cx="776" cy="30" r="9" fill="hsl(168 78% 46%)" opacity="0.25"/>
</svg>
