<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" font-family="ui-monospace, &#39;JetBrains Mono&#39;, SFMono-Regular, monospace">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="hsl(0 0% 100% / 0.05)" stroke-width="1"></path>
  </pattern>
  <radialGradient id="rad" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="hsl(18 90% 60%)" stop-opacity="0.4"></stop>
    <stop offset="60%" stop-color="hsl(18 90% 60%)" stop-opacity="0.06"></stop>
