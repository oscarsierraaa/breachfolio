<rect width="1200" height="675" fill="url(#vfade)"></rect>
<g font-size="14" letter-spacing="3" font-weight="500">
  <text x="40" y="56" fill="hsl(18 90% 60%)" opacity="0.95">TOOLS / 02</text>
  <text x="40" y="615" fill="hsl(240 5% 65%)" opacity="0.55">BURP SUITE  VS  OWASP ZAP</text>
