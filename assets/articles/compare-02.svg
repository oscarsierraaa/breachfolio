        <text x="40" y="70">POST /api/v1/login HTTP/2</text>
        <text x="40" y="92">Host: target.app</text>
        <text x="40" y="114">User-Agent: BurpSuite/2026.4</text>
        <text x="40" y="136">Content-Type: application/json</text>
        <text x="40" y="158">Cookie: sid=<tspan fill="hsl(18 90% 60%)">8a3f...</tspan></text>
        <text x="40" y="196" fill="hsl(36 92% 62%)">{</text>
        <text x="58" y="214" fill="hsl(36 92% 62%)">&#34;user&#34;: &#34;<tspan fill="hsl(18 90% 60%)">admin&#39; OR 1=1--</tspan>&#34;,</text>
