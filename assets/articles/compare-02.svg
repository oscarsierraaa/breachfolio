  </radialGradient>
  <linearGradient id="vfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="hsl(20 26% 8%)" stop-opacity="0"></stop>
    <stop offset="100%" stop-color="hsl(20 26% 8%)" stop-opacity="0.92"></stop>
  </linearGradient>
  <linearGradient id="hue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="hsl(36 92% 62%)"></stop>
    <stop offset="100%" stop-color="hsl(18 90% 60%)"></stop>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="hsl(20 30% 5%)"></rect>
<rect width="1200" height="675" fill="hsl(20 26% 8%)" opacity="0.6"></rect>
<rect width="1200" height="675" fill="url(#grid)"></rect>

  <g transform="translate(140 130)">
