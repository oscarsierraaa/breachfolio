    <circle cx="66" cy="22" r="6" fill="hsl(18 90% 60%)" opacity="0.85"></circle>
    <rect x="100" y="12" width="500" height="22" rx="11" fill="hsl(20 30% 5%)"></rect>
    <text x="116" y="28" font-size="12" fill="hsl(36 92% 62%)" letter-spacing="1">🔒 https://target.app/api/v1/login</text>
