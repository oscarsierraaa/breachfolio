      <rect x="470" y="0" width="430" height="320" rx="10" fill="hsl(20 26% 8%)" stroke="hsl(18 90% 60%)" stroke-opacity="0.15"></rect>
      <text x="490" y="34" font-size="12" fill="hsl(18 90% 60%)" letter-spacing="3">RESPONSE</text>
